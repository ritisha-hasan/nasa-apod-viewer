server.port=8082
spring.application.name=nasa-apod-viewer

# loads the nasa api key from the .env file
spring.config.import=optional:file:.env[.properties]
nasa.api.key=${NASA_API_KEY}

# where the database file lives: a file in a 'data' folder in the project
spring.datasource.url=jdbc:h2:file:./data/spacejournal

# tells Hibernate to automatically create/update tables based on Java entity classes
spring.jpa.hibernate.ddl-auto=update

# prints out the SQL Hibernate generates
spring.jpa.show-sql=true

spring.h2.console.enabled=true

spring.datasource.username=sa
spring.datasource.password=

